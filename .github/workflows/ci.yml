name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --base needs the PR base branch history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/validate.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/validate.mjs
          fi
      - name: Unit tests
        run: node --test
