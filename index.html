<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex">
<title>FloodMap TP.HCM</title>
<meta name="description" content="Bản đồ các tuyến đường, địa điểm ở TP.HCM hay ngập khi mưa lớn hoặc triều cường. / Map of Ho Chi Minh City streets and places that flood in heavy rain or at high tide.">
<!-- FloodMap. Static site: plain ES modules, no build step. Leaflet 1.9.4 from cdnjs with SRI. Spots and strings are loaded from data/. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<aside id="panel">
 <div class="panel-top">
  <div class="topbar" id="topbar">
    <h1 class="brand"><span data-i18n="appTitle">FloodMap TP.HCM</span></h1>
    <button type="button" class="lang" id="langBtn" data-i18n-attr="aria-label:switchLang;title:switchLang;lang:switchLangCode">
      <span data-l="vi">VI</span><span class="sep" aria-hidden="true">|</span><span data-l="en">EN</span>
    </button>
    <div class="search" id="search">
      <form id="searchForm" role="search" autocomplete="off" data-i18n-attr="aria-label:searchLabel">
        <input id="q" type="search" enterkeyhint="search" spellcheck="false" autocapitalize="off" autocorrect="off"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg"
               data-i18n-attr="placeholder:searchPlaceholder;aria-label:searchLabel">
        <button class="iconbtn" type="submit" data-i18n-attr="aria-label:searchBtn;title:searchBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
      <ul id="sugg" role="listbox" hidden data-i18n-attr="aria-label:suggLabel"></ul>
    </div>
  </div>

  <div class="filters" id="filters" role="group" data-i18n-attr="aria-label:filtersLabel">
    <button type="button" class="chip r-high" data-risk="high" aria-pressed="true"></button>
    <button type="button" class="chip r-medium" data-risk="medium" aria-pressed="true"></button>
    <button type="button" class="chip r-low" data-risk="low" aria-pressed="true"></button>
    <label class="chip sel"><span class="vh" data-i18n="causeLabel"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.5 6-11z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <select id="cause">
        <option value="all" data-i18n="causeAll"></option>
        <option value="rain" data-i18n="causeRainF"></option>
        <option value="tide" data-i18n="causeTideF"></option>
      </select>
    </label>
    <button type="button" class="chip" id="showResolved" aria-pressed="false">
      <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="showResolved"></span>
    </button>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
 </div>
 <div class="panel-scroll" id="panelScroll">

  <section id="details" class="sheet" hidden aria-labelledby="dName" tabindex="-1">
    <div class="sheet-head" id="detailsHead">
      <button type="button" class="grip" id="grip" aria-expanded="false" data-i18n-attr="aria-label:expand"><span></span></button>
      <button type="button" class="iconbtn" id="detailsClose" data-i18n-attr="aria-label:close;title:close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="detailsBody"></div>
  </section>

  <section id="legend" class="sheet" aria-labelledby="legendTitle" tabindex="-1">
    <div class="sheet-head">
      <h2 class="sheet-title" id="legendTitle" data-i18n="legend"></h2>
      <button type="button" class="legend-toggle" id="legendToggle" aria-expanded="true" aria-controls="legendBody">
        <span data-i18n="legend"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="iconbtn legend-close" id="legendClose" data-i18n-attr="aria-label:close;title:close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body lg" id="legendBody"></div>
  </section>

  <footer class="panel-foot">
    <p><button type="button" class="linkbtn" data-action="disclaimer" data-i18n="disclaimerLink"></button></p>
    <p data-i18n="tagline"></p>
    <p id="dataNote"></p>
  </footer>
 </div>
</aside>

<main id="map" data-i18n-attr="aria-label:mapLabel"></main>

<div class="fabs">
  <button type="button" class="fab" id="locate" data-i18n-attr="aria-label:locate;title:locate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="fab legend-fab" id="legendFab" aria-expanded="false" aria-controls="legend" data-i18n-attr="aria-label:legend;title:legend">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/></svg>
  </button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tilenotice" role="status" hidden></div>
<div id="libfail" class="fail" role="alert" hidden></div>
<div id="datafail" class="fail" role="alert" hidden></div>
<!-- Only used if data/i18n.json itself cannot be loaded, so it cannot come from that file. -->
<div id="bootfail" class="fail" role="alert" hidden>
  <p lang="vi">Không tải được dữ liệu của trang. Vui lòng tải lại trang sau ít phút.</p>
  <p lang="en">The page data couldn't load. Please reload the page in a few minutes.</p>
</div>

<dialog id="disclaimer" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h2 id="dlgTitle" data-i18n="disclaimerTitle"></h2>
    <div id="dlgBody"></div>
    <div class="actions"><button type="button" class="btn" id="dlgOk" data-i18n="disclaimerOk"></button></div>
  </div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
